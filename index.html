<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>اسکنر بارکد - سامانه انبارگردانی نمایشگاه ایران نوشت</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- موتور اصلیِ تشخیص بارکد: همیشه از ZXing نسخه‌ی وب‌اسمبلی استفاده می‌کند، نه موتور بومی
       گوشی. چون موتور بومی روی اندروید به یک ماژول گوگل‌پلی‌سرویسز وابسته‌ست که روی بعضی
       گوشی‌ها (مثلاً به‌خاطر محدودیت‌های منطقه‌ای) دانلود/فعال نمی‌شود و بی‌صدا هیچ‌چیز
       تشخیص نمی‌دهد؛ نسخه‌ی وب‌اسمبلی کاملاً مستقل و روی همه‌ی گوشی‌ها یکسان کار می‌کند -->
  <script src="https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/ponyfill.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
      color: #222;
    }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    h2 { margin-top: 0; text-align: center; }
    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      margin-bottom: 8px;
    }
    button.secondary { background: #6b7280; }
    .hidden { display: none !important; }
    #reader { width: 100%; margin: 10px auto; }
    .result-box { margin-top: 16px; padding: 16px; border-radius: 8px; text-align: center; font-size: 16px; }
    .result-found { background: #dcfce7; color: #166534; }
    .result-notfound { background: #fee2e2; color: #991b1b; }
    .msg { padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .msg-ok { background: #dcfce7; color: #166534; }
    .msg-err { background: #fee2e2; color: #991b1b; }
    .flex { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 8px; }
    .flex > div { flex: 1; }
    .flex button { margin-bottom: 0; }
    label { font-size: 13px; color: #555; }
  </style>
</head>
<body>
<div class="container">

  <!-- ورود -->
  <div class="card" id="loginCard">
    <h2>ورود به سامانه</h2>
    <div id="loginMsg"></div>
    <input type="text" id="username" placeholder="نام کاربری">
    <input type="password" id="password" placeholder="رمز عبور">
    <button onclick="doLogin()">ورود</button>
  </div>

  <!-- استعلام -->
  <div class="card hidden" id="mainCard">
    <h2>استعلام بارکد | <span id="userFullName"></span></h2>
    <input type="text" id="manualBarcode" placeholder="بارکد را وارد یا اسکن کنید"
      onkeydown="if(event.key==='Enter'){event.preventDefault(); submitInquiry();}">
    <button onclick="toggleScanner()" id="scanBtn">📷 اسکن با دوربین</button>
    <div id="reader" class="hidden"></div>
    <button onclick="submitInquiry()">استعلام</button>
    <button class="secondary" onclick="logout()">خروج</button>

    <div id="inquiryResult"></div>

    <div id="countsBox" class="hidden" style="margin-top:14px; border-top:1px solid #eee; padding-top:14px;">
      <h2 style="font-size:16px;">شمارش کالا</h2>
      <div id="countMsg"></div>
      <div class="flex">
        <div><label>شمارش اول</label><input type="number" id="count1" min="0" step="1"></div>
        <button onclick="saveCount(1)">ذخیره</button>
      </div>
      <div class="flex">
        <div><label>شمارش دوم</label><input type="number" id="count2" min="0" step="1"></div>
        <button onclick="saveCount(2)">ذخیره</button>
      </div>
      <div class="flex">
        <div><label>شمارش سوم</label><input type="number" id="count3" min="0" step="1"></div>
        <button onclick="saveCount(3)">ذخیره</button>
      </div>
    </div>
  </div>

</div>

<script>
  // آدرس سامانه به‌صورت ثابت تنظیم شده است
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJzZ8RzRL6wZ8MEpKiSYla4o0qhsrQfjkV01x04KRfme2nloWfrBTP2wY7yU3XNEWFng/exec';
  var currentUser = null; // { username, password, fullName }
  var currentProduct = null;
  var html5QrCode = null;
  var isScanning = false;
  var resultClearTimer = null;

  function showMsg(elId, text, ok) {
    document.getElementById(elId).innerHTML =
      '<div class="msg ' + (ok ? 'msg-ok' : 'msg-err') + '">' + text + '</div>';
  }

  function apiCall(params) {
    var url = SCRIPT_URL + '?' + Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch(url).then(function (res) { return res.json(); });
  }

  /* ---------------- ورود / خروج ---------------- */
  function doLogin() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value.trim();
    if (!u || !p) { showMsg('loginMsg', 'نام کاربری و رمز عبور را وارد کنید', false); return; }
    document.getElementById('loginMsg').innerHTML = '';

    apiCall({ action: 'login', username: u, password: p }).then(function (res) {
      if (res.success) {
        currentUser = { username: u, password: p, fullName: res.fullName };
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('mainCard').classList.remove('hidden');
        document.getElementById('userFullName').innerText = res.fullName;
      } else {
        showMsg('loginMsg', res.message || 'خطا در ورود', false);
      }
    }).catch(function (err) {
      showMsg('loginMsg', 'خطا در اتصال به سامانه: ' + err, false);
    });
  }

  function logout() {
    currentUser = null;
    stopScannerIfRunning();
    document.getElementById('mainCard').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
  }

  /* ---------------- استعلام ---------------- */
  function submitInquiry() {
    var barcode = document.getElementById('manualBarcode').value.trim();
    if (!barcode || !currentUser) return;

    apiCall({ action: 'lookup', username: currentUser.username, password: currentUser.password, barcode: barcode })
      .then(function (res) {
        var box = document.getElementById('inquiryResult');
        var countsBox = document.getElementById('countsBox');
        if (resultClearTimer) { clearTimeout(resultClearTimer); resultClearTimer = null; }

        if (res.found) {
          box.innerHTML =
            '<div class="result-box result-found">' +
            '✅ تامین‌کننده: <b>' + res.supplierName + '</b><br>' +
            'شماره تامین‌کننده: <b>' + res.supplierNumber + '</b><br>' +
            'نام کالا: ' + res.productName + ' | کد: ' + res.productCode + '<br>' +
            '<span style="font-size:20px;">موجودی انبار: <b>' + res.stock + '</b></span>' +
            '</div>';
          currentProduct = { supplierName: res.supplierName, rowIndex: res.rowIndex };
          document.getElementById('count1').value = res.count1;
          document.getElementById('count2').value = res.count2;
          document.getElementById('count3').value = res.count3;
          document.getElementById('countMsg').innerHTML = '';
          countsBox.classList.remove('hidden');
        } else {
          box.innerHTML = '<div class="result-box result-notfound">❌ ' + res.message + '</div>';
          currentProduct = null;
          countsBox.classList.add('hidden');
          resultClearTimer = setTimeout(function () { box.innerHTML = ''; }, 3000);
        }
        document.getElementById('manualBarcode').value = '';
        document.getElementById('manualBarcode').focus();
      }).catch(function (err) {
        document.getElementById('inquiryResult').innerHTML =
          '<div class="result-box result-notfound">خطا در اتصال: ' + err + '</div>';
      });
  }

  function saveCount(countNumber) {
    if (!currentProduct || !currentUser) return;
    var input = document.getElementById('count' + countNumber);
    var raw = input.value.trim();
    var num = Number(raw);
    if (raw === '' || !Number.isInteger(num) || num < 0) {
      showMsg('countMsg', 'لطفا یک عدد صحیح مثبت وارد کنید', false);
      return;
    }
    apiCall({
      action: 'savecount',
      username: currentUser.username,
      password: currentUser.password,
      supplierName: currentProduct.supplierName,
      rowIndex: currentProduct.rowIndex,
      countNumber: countNumber,
      value: num
    }).then(function (res) {
      showMsg('countMsg', res.message, res.success);
    }).catch(function (err) {
      showMsg('countMsg', 'خطا در اتصال: ' + err, false);
    });
  }

  /* ---------------- اسکنر دوربین ----------------
   * موتور تشخیص: همیشه از کتابخانه‌ی barcode-detector با موتور ZXing وب‌اسمبلی استفاده
   * می‌شود (window.BarcodeDetectionAPI.BarcodeDetector) — نه از BarcodeDetector بومی گوشی،
   * حتی اگر گوشی آن را داشته باشد. دلیل: BarcodeDetector بومیِ اندروید به یک ماژول
   * گوگل‌پلی‌سرویسز وابسته است که روی بعضی گوشی‌ها/مناطق دانلود یا فعال نمی‌شود؛ در آن حالت
   * تابع تشخیص هیچ خطایی نمی‌دهد ولی همیشه لیست خالی برمی‌گرداند (یعنی «اصلاً چیزی شناسایی
   * نمی‌کند» بدون هیچ پیام خطا). موتور وب‌اسمبلی کاملاً مستقل از گوگل است و روی همه‌ی
   * گوشی‌ها (اندروید، آیفون، هر مرورگری) یکسان کار می‌کند. html5-qrcode فقط پشتیبان نهایی
   * است، برای وقتی که به هر دلیل (مثلاً قطعی اینترنت) کتابخانه‌ی بالا اصلاً بارگذاری نشود.
   *
   * برای بارکدهای بسیار ریز (مثل لوازم‌التحریر) دو ترفند اضافه هم اعمال شده:
   * ۱) بزرگ‌نمایی سخت‌افزاری دوربین، روی گوشی‌هایی که پشتیبانی می‌کنند (اسلایدر زیر تصویر).
   * ۲) بزرگ‌نمایی دیجیتال خودکار: اگر بارکد در نگاه اول تشخیص داده نشود، ناحیه‌ی داخل کادر
   *    سبز برش خورده، بزرگ می‌شود و دوباره روی همان ناحیه تشخیص اجرا می‌شود.
   */
  var mediaStream = null;
  var videoTrack = null;
  var barcodeDetector = null;
  var scanTimerId = null;
  var usingDetectorApi = false; // true = از موتور BarcodeDetector استفاده می‌شود
  var torchOn = false;

  // نسبت‌های کادر راهنما (هم برای نمایش کادر سبز و هم برای برش بزرگ‌نمایی دیجیتال استفاده می‌شود)
  var GUIDE_X = 0.06;
  var GUIDE_TOP = 0.30;
  var GUIDE_BOTTOM = 0.30;
  var ZOOM_SCALE = 2.2;

  var cropCanvas = document.createElement('canvas');
  var cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

  function toggleScanner() {
    if (isScanning) { stopScannerIfRunning(); return; }
    var reader = document.getElementById('reader');
    reader.classList.remove('hidden');
    reader.innerHTML = '<p style="text-align:center; color:#888;">در حال باز کردن دوربین...</p>';
    startScanner(reader);
  }

  // کلاس BarcodeDetector را برمی‌گرداند: همیشه اول نسخه‌ی وب‌اسمبلیِ مستقل از گوگل را
  // برمی‌دارد؛ فقط اگر آن اصلاً بارگذاری نشده باشد، به نسخه‌ی بومی مرورگر (اگر باشد) برمی‌گردد.
  function getDetectorClass() {
    if (window.BarcodeDetectionAPI && window.BarcodeDetectionAPI.BarcodeDetector) {
      return window.BarcodeDetectionAPI.BarcodeDetector;
    }
    return window.BarcodeDetector;
  }

  function startScanner(reader) {
    var DetectorClass = getDetectorClass();
    if (typeof DetectorClass === 'undefined') {
      // هیچ موتور BarcodeDetector‌ای در دسترس نیست (مثلاً قطعی اینترنت)؛ به پشتیبان نهایی می‌رویم
      startHtml5QrcodeScanner(reader);
      return;
    }

    var barcodeFormats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'codabar', 'itf'];
    try {
      barcodeDetector = new DetectorClass({ formats: barcodeFormats });
    } catch (e) {
      console.warn('ساخت BarcodeDetector ناموفق بود:', e);
      startHtml5QrcodeScanner(reader);
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 2560 },
        height: { ideal: 1440 },
        advanced: [{ focusMode: "continuous" }]
      }
    })
      .then(function (stream) {
        mediaStream = stream;
        videoTrack = stream.getVideoTracks()[0];
        buildScannerUI(reader);
        var video = document.getElementById('scannerVideo');
        video.srcObject = stream;
        return video.play().then(function () { return video; });
      })
      .then(function (video) {
        usingDetectorApi = true;
        isScanning = true;
        setupZoomControl();
        setupTorchControl();
        runDetectionLoop(video);
      })
      .catch(function (err) {
        console.warn('راه‌اندازی دوربین ناموفق بود:', err);
        reader.classList.add('hidden');
        reader.innerHTML = '';
        alert('دسترسی به دوربین ممکن نشد یا دوربینی پیدا نشد: ' + (err && err.message ? err.message : err));
      });
  }

  function buildScannerUI(reader) {
    reader.innerHTML =
      '<div id="scannerWrap" style="position:relative; border-radius:8px; overflow:hidden; background:#000;">' +
        '<video id="scannerVideo" playsinline autoplay muted style="width:100%; display:block;"></video>' +
        '<div style="position:absolute; left:' + (GUIDE_X * 100) + '%; right:' + (GUIDE_X * 100) + '%; top:' + (GUIDE_TOP * 100) + '%; bottom:' + (GUIDE_BOTTOM * 100) + '%; border:3px solid #22c55e; border-radius:10px; box-shadow:0 0 0 2000px rgba(0,0,0,.35); pointer-events:none;"></div>' +
        '<button type="button" id="torchBtn" class="hidden" style="position:absolute; bottom:10px; left:10px; width:auto; margin:0; padding:8px 12px; background:rgba(0,0,0,.55); font-size:18px; border-radius:6px;">🔦</button>' +
      '</div>' +
      '<div id="zoomRow" class="hidden" style="display:flex; align-items:center; gap:8px; margin-top:8px;">' +
        '<span style="font-size:12px; color:#555; white-space:nowrap;">🔍 بزرگ‌نمایی</span>' +
        '<input type="range" id="zoomRange" min="1" max="2" step="0.1" value="1" style="flex:1;">' +
      '</div>' +
      '<p style="font-size:12px; color:#888; text-align:center; margin:6px 0 0;">برای بارکدهای ریز، آن را داخل کادر سبز و نزدیک دوربین نگه دارید</p>';
  }

  function runDetectionLoop(video) {
    var busy = false;
    scanTimerId = setInterval(function () {
      if (!isScanning || busy || video.readyState < 2) return;
      busy = true;
      try {
        detectFrame(video).then(function (code) {
          busy = false;
          if (code) {
            document.getElementById('manualBarcode').value = code;
            stopScannerIfRunning();
            submitInquiry();
          }
        }).catch(function () { busy = false; });
      } catch (e) {
        busy = false; // اگر تشخیص یک فریم به‌صورت غیرمنتظره خطای همزمان بدهد، اسکنر قفل نشود
      }
    }, 180);
  }

  function detectFrame(video) {
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return Promise.resolve(null);

    return barcodeDetector.detect(video).then(function (codes) {
      if (codes && codes.length) return codes[0].rawValue;

      // بارکد در نگاه اول پیدا نشد؛ ناحیه‌ی داخل کادر راهنما را برش و بزرگ می‌کنیم (اجناس ریز)
      var cx = vw * GUIDE_X, cy = vh * GUIDE_TOP;
      var cw = vw * (1 - GUIDE_X * 2);
      var ch = vh * (1 - GUIDE_TOP - GUIDE_BOTTOM);
      if (cw <= 0 || ch <= 0) return null;

      cropCanvas.width = Math.round(cw * ZOOM_SCALE);
      cropCanvas.height = Math.round(ch * ZOOM_SCALE);
      cropCtx.drawImage(video, cx, cy, cw, ch, 0, 0, cropCanvas.width, cropCanvas.height);

      return barcodeDetector.detect(cropCanvas).then(function (codes2) {
        return (codes2 && codes2.length) ? codes2[0].rawValue : null;
      });
    });
  }

  function setupZoomControl() {
    try {
      var zoomRow = document.getElementById('zoomRow');
      var zoomRange = document.getElementById('zoomRange');
      if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
      var caps = videoTrack.getCapabilities();
      if (!caps.zoom) return; // مثلاً سافاری/آیفون این قابلیت را ندارد
      zoomRange.min = caps.zoom.min;
      zoomRange.max = caps.zoom.max;
      zoomRange.step = caps.zoom.step || 0.1;
      var settings = videoTrack.getSettings();
      zoomRange.value = settings.zoom || caps.zoom.min;
      zoomRow.classList.remove('hidden');
      zoomRange.oninput = function () {
        videoTrack.applyConstraints({ advanced: [{ zoom: Number(zoomRange.value) }] }).catch(function () {});
      };
    } catch (e) { /* بزرگ‌نمایی سخت‌افزاری در دسترس نیست */ }
  }

  function setupTorchControl() {
    try {
      var torchBtn = document.getElementById('torchBtn');
      if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
      var caps = videoTrack.getCapabilities();
      if (!caps.torch) return; // مثلاً سافاری/آیفون این قابلیت را ندارد
      torchOn = false;
      torchBtn.classList.remove('hidden');
      torchBtn.onclick = function () {
        torchOn = !torchOn;
        videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
        torchBtn.style.background = torchOn ? 'rgba(250,204,21,.9)' : 'rgba(0,0,0,.55)';
      };
    } catch (e) { /* چراغ‌قوه در دسترس نیست */ }
  }

  /* --- پشتیبان نهایی: کتابخانه‌ی html5-qrcode (فقط وقتی BarcodeDetector اصلاً در دسترس نیست) --- */
  function startHtml5QrcodeScanner(reader) {
    if (typeof Html5Qrcode === 'undefined') {
      alert('کتابخانه اسکنر بارگذاری نشده. اتصال اینترنت را بررسی کنید.');
      reader.classList.add('hidden');
      return;
    }
    usingDetectorApi = false;

    navigator.mediaDevices.getUserMedia({ video: true }).then(function (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(function (devices) {
        if (!devices || devices.length === 0) {
          alert('هیچ دوربینی پیدا نشد');
          reader.classList.add('hidden');
          return;
        }
        var chosen = devices.find(function (d) { return /back|rear|environment/i.test(d.label); }) || devices[0];
        isScanning = true;
        html5QrCode.start(chosen.id, {
          fps: 15,
          qrbox: { width: 300, height: 140 },
          aspectRatio: 1.777778,
          disableFlip: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.CODABAR,
            Html5QrcodeSupportedFormats.ITF
          ],
          videoConstraints: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: "continuous" }]
          }
        }, function (decodedText) {
          document.getElementById('manualBarcode').value = decodedText;
          stopScannerIfRunning();
          submitInquiry();
        }, function () {}).catch(function (err) {
          alert('خطا در راه‌اندازی دوربین: ' + err);
          isScanning = false;
          reader.classList.add('hidden');
        });
      });
    }).catch(function (err) {
      alert('اجازه دسترسی به دوربین داده نشد: ' + err);
      reader.classList.add('hidden');
    });
  }

  function stopScannerIfRunning() {
    isScanning = false;
    if (scanTimerId) { clearInterval(scanTimerId); scanTimerId = null; }
    if (mediaStream) {
      mediaStream.getTracks().forEach(function (t) { t.stop(); });
      mediaStream = null;
    }
    videoTrack = null;
    if (html5QrCode && usingDetectorApi === false) {
      html5QrCode.stop().then(function () { html5QrCode.clear(); }).catch(function () {});
    }
    var reader = document.getElementById('reader');
    reader.classList.add('hidden');
    reader.innerHTML = '';
  }
</script>
</body>
</html>
