<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>اسکنر بارکد - سامانه انبارگردانی نمایشگاه ایران نوشت</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- موتور اصلیِ تشخیص بارکد: همیشه از ZXing نسخه‌ی وب‌اسمبلی استفاده می‌کند، نه موتور بومی
       گوشی. چون موتور بومی روی اندروید به یک ماژول گوگل‌پلی‌سرویسز وابسته‌ست که روی بعضی
       گوشی‌ها (مثلاً به‌خاطر محدودیت‌های منطقه‌ای) دانلود/فعال نمی‌شود و بی‌صدا هیچ‌چیز
       تشخیص نمی‌دهد؛ نسخه‌ی وب‌اسمبلی کاملاً مستقل و روی همه‌ی گوشی‌ها یکسان کار می‌کند -->
  <script src="https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/ponyfill.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
      color: #222;
    }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    h2 { margin-top: 0; text-align: center; }
    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      margin-bottom: 8px;
    }
    button.secondary { background: #6b7280; }
    button.count-btn { background: #7c3aed; }
    .hidden { display: none !important; }
    #reader { width: 100%; margin: 10px auto; }
    .result-box { margin-top: 16px; padding: 16px; border-radius: 8px; text-align: center; font-size: 16px; }
    .result-found { background: #dcfce7; color: #166534; }
    .result-notfound { background: #fee2e2; color: #991b1b; }
    .msg { padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .msg-ok { background: #dcfce7; color: #166534; }
    .msg-err { background: #fee2e2; color: #991b1b; }
    .flex { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .flex > div { flex: 2; }
    .flex > div.btn-col { flex: 1; }
    .flex button { width: 100%; margin: 6px 0 0 0; padding-left: 4px; padding-right: 4px; transition: background 0.2s; }
    .flex button.pending { background: #f59e0b; }
    .flex button.saved { background: #22c55e; }
    label { font-size: 13px; color: #555; display: block; }
    .savedInfo { font-size: 11px; color: #888; font-weight: normal; }
  </style>
</head>
<body>
<div class="container">

  <!-- ورود -->
  <div class="card" id="loginCard">
    <h2>ورود به سامانه</h2>
    <div id="loginMsg"></div>
    <input type="text" id="username" placeholder="نام کاربری">
    <input type="password" id="password" placeholder="رمز عبور">
    <button onclick="doLogin()">ورود</button>
  </div>

  <!-- استعلام -->
  <div class="card hidden" id="mainCard">
    <h2>استعلام بارکد | <span id="userFullName"></span></h2>

    <label>جستجوی نام یا کد کالا</label>
    <input type="text" id="productSearch" list="productListOptions" placeholder="نام یا کد کالا را تایپ یا از لیست انتخاب کنید">
    <datalist id="productListOptions"></datalist>

    <input type="text" id="manualBarcode" placeholder="بارکد را وارد یا اسکن کنید"
      onkeydown="if(event.key==='Enter'){event.preventDefault(); submitInquiry();}">
    <button onclick="toggleScanner()" id="scanBtn">📷 اسکن با دوربین</button>
    <div id="reader" class="hidden"></div>

    <!-- نمایش زنده‌ی شمارش تعداد با دوربین (بعد از شناسایی کالا) -->
    <div id="countLiveBox" class="hidden" style="text-align:center; margin-bottom:10px;">
      <div id="countLiveProductName" style="font-size:14px; color:#555; min-height:20px;"></div>
      <div id="countLiveDisplay" style="font-size:36px; font-weight:bold; color:#7c3aed;">0</div>
      <div style="font-size:12px; color:#888; margin-bottom:8px;">کالاها را طوری زیر دوربین بگیرید که همه داخل کادر سبز و از هم جدا باشند</div>
      <button onclick="finishObjectCounting()">✅ ثبت این تعداد</button>
      <button class="secondary" onclick="cancelObjectCounting()">لغو شمارش</button>
    </div>

    <button onclick="submitInquiry()">استعلام</button>
    <button class="secondary" onclick="logout()">خروج</button>

    <div id="inquiryResult"></div>

    <!-- انتخاب اینکه تعداد شمارش‌شده به کدام شمارش اضافه شود -->
    <div id="tallyAssignBox" class="hidden" style="margin-top:14px; border-top:1px solid #eee; padding-top:14px;">
      <div class="tallyCountText" style="font-weight:bold; margin-bottom:10px; text-align:center;"></div>
      <button onclick="assignTally(1)">افزودن به شمارش اول</button>
      <button onclick="assignTally(2)">افزودن به شمارش دوم</button>
      <button onclick="assignTally(3)">افزودن به شمارش سوم</button>
      <button class="secondary" onclick="cancelTallyAssign()">لغو</button>
    </div>

    <div id="countsBox" class="hidden" style="margin-top:14px; border-top:1px solid #eee; padding-top:14px;">
      <h2 style="font-size:16px;">شمارش کالا</h2>
      <div id="countMsg"></div>

      <button class="count-btn" onclick="startObjectCounting()">🔢 شمارش تعداد با دوربین</button>

      <div class="flex">
        <div><label>شمارش اول <span class="savedInfo" id="savedInfo1"></span></label><input type="number" id="count1" min="0" step="1"></div>
        <div><label>مقدار جدید</label><input type="number" id="new1" min="0" step="1"></div>
        <div class="btn-col"><label>&nbsp;</label><button id="saveBtn1" onclick="saveCount(1)">ذخیره</button></div>
      </div>
      <div class="flex">
        <div><label>شمارش دوم <span class="savedInfo" id="savedInfo2"></span></label><input type="number" id="count2" min="0" step="1"></div>
        <div><label>مقدار جدید</label><input type="number" id="new2" min="0" step="1"></div>
        <div class="btn-col"><label>&nbsp;</label><button id="saveBtn2" onclick="saveCount(2)">ذخیره</button></div>
      </div>
      <div class="flex">
        <div><label>شمارش سوم <span class="savedInfo" id="savedInfo3"></span></label><input type="number" id="count3" min="0" step="1"></div>
        <div><label>مقدار جدید</label><input type="number" id="new3" min="0" step="1"></div>
        <div class="btn-col"><label>&nbsp;</label><button id="saveBtn3" onclick="saveCount(3)">ذخیره</button></div>
      </div>
    </div>
  </div>

</div>

<script>
  // آدرس سامانه به‌صورت ثابت تنظیم شده است
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJzZ8RzRL6wZ8MEpKiSYla4o0qhsrQfjkV01x04KRfme2nloWfrBTP2wY7yU3XNEWFng/exec';
  var currentUser = null; // { username, password, fullName }
  var currentProduct = null;
  var html5QrCode = null;
  var isScanning = false;
  var resultClearTimer = null;

  function showMsg(elId, text, ok) {
    document.getElementById(elId).innerHTML =
      '<div class="msg ' + (ok ? 'msg-ok' : 'msg-err') + '">' + text + '</div>';
  }

  function apiCall(params) {
    var url = SCRIPT_URL + '?' + Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch(url).then(function (res) { return res.json(); });
  }

  /* ---------------- ورود / خروج ---------------- */
  function doLogin() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value.trim();
    if (!u || !p) { showMsg('loginMsg', 'نام کاربری و رمز عبور را وارد کنید', false); return; }
    document.getElementById('loginMsg').innerHTML = '';

    apiCall({ action: 'login', username: u, password: p }).then(function (res) {
      if (res.success) {
        currentUser = { username: u, password: p, fullName: res.fullName };
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('mainCard').classList.remove('hidden');
        document.getElementById('userFullName').innerText = res.fullName;
        loadProductList();
      } else {
        showMsg('loginMsg', res.message || 'خطا در ورود', false);
      }
    }).catch(function (err) {
      showMsg('loginMsg', 'خطا در اتصال به سامانه: ' + err, false);
    });
  }

  function logout() {
    currentUser = null;
    stopScannerIfRunning();
    document.getElementById('mainCard').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
  }

  /* ---------------- جستجوی نام/کد کالا با لیست کشویی ---------------- */
  var allProducts = [];

  function productLabel(p) {
    return (p.name || '') + ' (' + (p.code || '') + ')';
  }

  function loadProductList() {
    if (!currentUser) return;
    apiCall({ action: 'listproducts', username: currentUser.username, password: currentUser.password })
      .then(function (res) {
        if (!res.success) return;
        allProducts = res.products || [];
        var dl = document.getElementById('productListOptions');
        dl.innerHTML = '';
        allProducts.forEach(function (p) {
          var opt = document.createElement('option');
          opt.value = productLabel(p);
          dl.appendChild(opt);
        });
      })
      .catch(function () {});
  }

  function selectSearchedProduct() {
    var input = document.getElementById('productSearch');
    var val = input.value.trim();
    if (!val) return;
    var match = allProducts.find(function (p) { return productLabel(p) === val; });
    if (!match) return;
    var firstBarcode = String(match.barcode || '').split(',')[0].trim();
    if (!firstBarcode) return;
    input.value = '';
    document.getElementById('manualBarcode').value = firstBarcode;
    submitInquiry();
  }

  document.getElementById('productSearch').addEventListener('change', selectSearchedProduct);
  document.getElementById('productSearch').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      selectSearchedProduct();
    }
  });

  /* ---------------- استعلام ---------------- */
  function renderInquiryResult(res) {
    var box = document.getElementById('inquiryResult');
    var countsBox = document.getElementById('countsBox');
    if (resultClearTimer) { clearTimeout(resultClearTimer); resultClearTimer = null; }

    if (res.found) {
      box.innerHTML =
        '<div class="result-box result-found">' +
        '✅ تامین‌کننده: <b>' + res.supplierName + '</b><br>' +
        'کد تامین‌کننده: <b>' + res.supplierNumber + '</b><br>' +
        'نام کالا: ' + res.productName + '<br>' +
        'کد کالا: ' + res.productCode + '<br>' +
        'بارکد: ' + res.barcode + '<br>' +
        '<span style="font-size:20px;">موجودی انبار: <b>' + res.stock + '</b></span>' +
        '</div>';
      currentProduct = { supplierName: res.supplierName, rowIndex: res.rowIndex, productName: res.productName };
      document.getElementById('count1').value = res.count1;
      document.getElementById('count2').value = res.count2;
      document.getElementById('count3').value = res.count3;
      [1, 2, 3].forEach(function (n) {
        document.getElementById('new' + n).value = '';
        var b = document.getElementById('saveBtn' + n);
        b.classList.remove('pending', 'saved');
        var cVal = document.getElementById('count' + n).value;
        lastSaved[n] = (cVal === '' || cVal === undefined) ? 0 : Number(cVal);
        updateSavedInfo(n);
      });
      document.getElementById('countMsg').innerHTML = '';
      countsBox.classList.remove('hidden');
    } else {
      box.innerHTML = '<div class="result-box result-notfound">❌ ' + res.message + '</div>';
      currentProduct = null;
      countsBox.classList.add('hidden');
      resultClearTimer = setTimeout(function () { box.innerHTML = ''; }, 3000);
    }
  }

  function submitInquiry() {
    var barcode = document.getElementById('manualBarcode').value.trim();
    if (!barcode || !currentUser) return;

    apiCall({ action: 'lookup', username: currentUser.username, password: currentUser.password, barcode: barcode })
      .then(function (res) {
        renderInquiryResult(res);
        document.getElementById('manualBarcode').value = '';
        document.getElementById('manualBarcode').blur();
      }).catch(function (err) {
        document.getElementById('inquiryResult').innerHTML =
          '<div class="result-box result-notfound">خطا در اتصال: ' + err + '</div>';
      });
  }

  /* ---------------- شمارش کالا (ویرایش مستقیم شمارش + افزودن مقدار جدید) ---------------- */
  var lastSaved = { 1: 0, 2: 0, 3: 0 };

  function updateSavedInfo(n) {
    document.getElementById('savedInfo' + n).innerText =
      '(' + lastSaved[n] + ')';
  }

  function saveCount(countNumber) {
    if (!currentProduct || !currentUser) return;
    var newInput = document.getElementById('new' + countNumber);
    var countInput = document.getElementById('count' + countNumber);
    var btn = document.getElementById('saveBtn' + countNumber);

    var countRaw = countInput.value.toString().trim();
    var countNum;
    if (countRaw === '') {
      countNum = 0;
    } else {
      countNum = Number(countRaw);
      if (!Number.isInteger(countNum) || countNum < 0) {
        showMsg('countMsg', 'مقدار باکس شمارش باید یک عدد صحیح مثبت باشد', false);
        return;
      }
    }

    var newRaw = newInput.value.trim();
    var newNum = 0;
    if (newRaw !== '') {
      newNum = Number(newRaw);
      if (!Number.isInteger(newNum) || newNum < 0) {
        showMsg('countMsg', 'لطفا یک عدد صحیح مثبت در باکس «مقدار جدید» وارد کنید', false);
        return;
      }
    }

    if (newRaw === '' && countNum === lastSaved[countNumber]) {
      showMsg('countMsg', 'تغییری برای ذخیره وجود ندارد', false);
      return;
    }

    var total = countNum + newNum;

    apiCall({
      action: 'savecount',
      username: currentUser.username,
      password: currentUser.password,
      supplierName: currentProduct.supplierName,
      rowIndex: currentProduct.rowIndex,
      countNumber: countNumber,
      value: total
    }).then(function (res) {
      showMsg('countMsg', res.message, res.success);
      if (res.success) {
        countInput.value = total;
        newInput.value = '';
        lastSaved[countNumber] = total;
        updateSavedInfo(countNumber);
        btn.classList.remove('pending');
        btn.classList.add('saved');
      }
    }).catch(function (err) {
      showMsg('countMsg', 'خطا در اتصال: ' + err, false);
    });
  }

  [1, 2, 3].forEach(function (n) {
    var newInput = document.getElementById('new' + n);
    var countInput = document.getElementById('count' + n);
    var btn = document.getElementById('saveBtn' + n);

    newInput.addEventListener('input', function () {
      btn.classList.remove('saved');
      btn.classList.add('pending');
    });

    countInput.addEventListener('input', function () {
      btn.classList.remove('saved');
      btn.classList.add('pending');
    });
  });


  /* ---------------- اسکنر دوربین (برای شناسایی بارکد کالا) ----------------
   * موتور تشخیص: همیشه از کتابخانه‌ی barcode-detector با موتور ZXing وب‌اسمبلی استفاده
   * می‌شود (window.BarcodeDetectionAPI.BarcodeDetector) — نه از BarcodeDetector بومی گوشی،
   * حتی اگر گوشی آن را داشته باشد. دلیل: BarcodeDetector بومیِ اندروید به یک ماژول
   * گوگل‌پلی‌سرویسز وابسته است که روی بعضی گوشی‌ها/مناطق دانلود یا فعال نمی‌شود؛ در آن حالت
   * تابع تشخیص هیچ خطایی نمی‌دهد ولی همیشه لیست خالی برمی‌گرداند. موتور وب‌اسمبلی کاملاً
   * مستقل از گوگل است و روی همه‌ی گوشی‌ها یکسان کار می‌کند. html5-qrcode فقط پشتیبان نهایی
   * است، برای وقتی که به هر دلیل کتابخانه‌ی بالا اصلاً بارگذاری نشود.
   *
   * برای بارکدهای بسیار ریز (مثل لوازم‌التحریر) دو ترفند اضافه هم اعمال شده:
   * ۱) بزرگ‌نمایی سخت‌افزاری دوربین، روی گوشی‌هایی که پشتیبانی می‌کنند (اسلایدر زیر تصویر).
   * ۲) بزرگ‌نمایی دیجیتال خودکار: اگر بارکد در نگاه اول تشخیص داده نشود، ناحیه‌ی داخل کادر
   *    سبز برش خورده، بزرگ می‌شود و دوباره روی همان ناحیه تشخیص اجرا می‌شود.
   */
  var mediaStream = null;
  var videoTrack = null;
  var barcodeDetector = null;
  var scanTimerId = null;
  var usingDetectorApi = false; // true = از موتور BarcodeDetector استفاده می‌شود
  var torchOn = false;

  // نسبت‌های کادر راهنما (هم برای نمایش کادر سبز و هم برای برش بزرگ‌نمایی/شمارش استفاده می‌شود)
  var GUIDE_X = 0.06;
  var GUIDE_TOP = 0.30;
  var GUIDE_BOTTOM = 0.30;
  var ZOOM_SCALE = 2.2;

  var cropCanvas = document.createElement('canvas');
  var cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

  function toggleScanner() {
    if (isScanning) { stopScannerIfRunning(); return; }
    var reader = document.getElementById('reader');
    reader.classList.remove('hidden');
    reader.innerHTML = '<p style="text-align:center; color:#888;">در حال باز کردن دوربین...</p>';
    startScanner(reader);
  }

  // کلاس BarcodeDetector را برمی‌گرداند: همیشه اول نسخه‌ی وب‌اسمبلیِ مستقل از گوگل را
  // برمی‌دارد؛ فقط اگر آن اصلاً بارگذاری نشده باشد، به نسخه‌ی بومی مرورگر (اگر باشد) برمی‌گردد.
  function getDetectorClass() {
    if (window.BarcodeDetectionAPI && window.BarcodeDetectionAPI.BarcodeDetector) {
      return window.BarcodeDetectionAPI.BarcodeDetector;
    }
    return window.BarcodeDetector;
  }

  function startScanner(reader) {
    var DetectorClass = getDetectorClass();
    if (typeof DetectorClass === 'undefined') {
      startHtml5QrcodeScanner(reader);
      return;
    }

    var barcodeFormats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'codabar', 'itf'];
    try {
      barcodeDetector = new DetectorClass({ formats: barcodeFormats });
    } catch (e) {
      console.warn('ساخت BarcodeDetector ناموفق بود:', e);
      startHtml5QrcodeScanner(reader);
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 2560 },
        height: { ideal: 1440 },
        advanced: [{ focusMode: "continuous" }]
      }
    })
      .then(function (stream) {
        mediaStream = stream;
        videoTrack = stream.getVideoTracks()[0];
        buildScannerUI(reader);
        var video = document.getElementById('scannerVideo');
        video.srcObject = stream;
        return video.play().then(function () { return video; });
      })
      .then(function (video) {
        usingDetectorApi = true;
        isScanning = true;
        setupZoomControl();
        setupTorchControl();
        runDetectionLoop(video);
      })
      .catch(function (err) {
        console.warn('راه‌اندازی دوربین ناموفق بود:', err);
        reader.classList.add('hidden');
        reader.innerHTML = '';
        alert('دسترسی به دوربین ممکن نشد یا دوربینی پیدا نشد: ' + (err && err.message ? err.message : err));
      });
  }

  function buildScannerUI(reader) {
    reader.innerHTML =
      '<div id="scannerWrap" style="position:relative; border-radius:8px; overflow:hidden; background:#000;">' +
        '<video id="scannerVideo" playsinline autoplay muted style="width:100%; display:block;"></video>' +
        '<div style="position:absolute; left:' + (GUIDE_X * 100) + '%; right:' + (GUIDE_X * 100) + '%; top:' + (GUIDE_TOP * 100) + '%; bottom:' + (GUIDE_BOTTOM * 100) + '%; border:3px solid #22c55e; border-radius:10px; box-shadow:0 0 0 2000px rgba(0,0,0,.35); pointer-events:none;"></div>' +
        '<button type="button" id="torchBtn" class="hidden" style="position:absolute; bottom:10px; left:10px; width:auto; margin:0; padding:8px 12px; background:rgba(0,0,0,.55); font-size:18px; border-radius:6px;">🔦</button>' +
      '</div>' +
      '<div id="zoomRow" class="hidden" style="display:flex; align-items:center; gap:8px; margin-top:8px;">' +
        '<span style="font-size:12px; color:#555; white-space:nowrap;">🔍 بزرگ‌نمایی</span>' +
        '<input type="range" id="zoomRange" min="1" max="2" step="0.1" value="1" style="flex:1;">' +
      '</div>' +
      '<p style="font-size:12px; color:#888; text-align:center; margin:6px 0 0;">کالا را داخل کادر سبز و نزدیک دوربین نگه دارید</p>';
  }

  function runDetectionLoop(video) {
    var busy = false;
    scanTimerId = setInterval(function () {
      if (!isScanning || busy || video.readyState < 2) return;
      busy = true;
      try {
        detectFrame(video).then(function (code) {
          busy = false;
          if (code) {
            document.getElementById('manualBarcode').value = code;
            stopScannerIfRunning();
            submitInquiry();
          }
        }).catch(function () { busy = false; });
      } catch (e) {
        busy = false;
      }
    }, 180);
  }

  function detectFrame(video) {
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return Promise.resolve(null);

    return barcodeDetector.detect(video).then(function (codes) {
      if (codes && codes.length) return codes[0].rawValue;

      var cx = vw * GUIDE_X, cy = vh * GUIDE_TOP;
      var cw = vw * (1 - GUIDE_X * 2);
      var ch = vh * (1 - GUIDE_TOP - GUIDE_BOTTOM);
      if (cw <= 0 || ch <= 0) return null;

      cropCanvas.width = Math.round(cw * ZOOM_SCALE);
      cropCanvas.height = Math.round(ch * ZOOM_SCALE);
      cropCtx.drawImage(video, cx, cy, cw, ch, 0, 0, cropCanvas.width, cropCanvas.height);

      return barcodeDetector.detect(cropCanvas).then(function (codes2) {
        return (codes2 && codes2.length) ? codes2[0].rawValue : null;
      });
    });
  }

  function setupZoomControl() {
    try {
      var zoomRow = document.getElementById('zoomRow');
      var zoomRange = document.getElementById('zoomRange');
      if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
      var caps = videoTrack.getCapabilities();
      if (!caps.zoom) return;
      zoomRange.min = caps.zoom.min;
      zoomRange.max = caps.zoom.max;
      zoomRange.step = caps.zoom.step || 0.1;
      var settings = videoTrack.getSettings();
      zoomRange.value = settings.zoom || caps.zoom.min;
      zoomRow.classList.remove('hidden');
      zoomRange.oninput = function () {
        videoTrack.applyConstraints({ advanced: [{ zoom: Number(zoomRange.value) }] }).catch(function () {});
      };
    } catch (e) { /* بزرگ‌نمایی سخت‌افزاری در دسترس نیست */ }
  }

  function setupTorchControl() {
    try {
      var torchBtn = document.getElementById('torchBtn');
      if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
      var caps = videoTrack.getCapabilities();
      if (!caps.torch) return;
      torchOn = false;
      torchBtn.classList.remove('hidden');
      torchBtn.onclick = function () {
        torchOn = !torchOn;
        videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
        torchBtn.style.background = torchOn ? 'rgba(250,204,21,.9)' : 'rgba(0,0,0,.55)';
      };
    } catch (e) { /* چراغ‌قوه در دسترس نیست */ }
  }

  /* --- پشتیبان نهایی: کتابخانه‌ی html5-qrcode (فقط وقتی BarcodeDetector اصلاً در دسترس نیست) --- */
  function startHtml5QrcodeScanner(reader) {
    if (typeof Html5Qrcode === 'undefined') {
      alert('کتابخانه اسکنر بارگذاری نشده. اتصال اینترنت را بررسی کنید.');
      reader.classList.add('hidden');
      return;
    }
    usingDetectorApi = false;

    navigator.mediaDevices.getUserMedia({ video: true }).then(function (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(function (devices) {
        if (!devices || devices.length === 0) {
          alert('هیچ دوربینی پیدا نشد');
          reader.classList.add('hidden');
          return;
        }
        var chosen = devices.find(function (d) { return /back|rear|environment/i.test(d.label); }) || devices[0];
        isScanning = true;
        html5QrCode.start(chosen.id, {
          fps: 15,
          qrbox: { width: 300, height: 140 },
          aspectRatio: 1.777778,
          disableFlip: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODABAR,
            Html5QrcodeSupportedFormats.ITF
          ],
          videoConstraints: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: "continuous" }]
          }
        }, function (decodedText) {
          document.getElementById('manualBarcode').value = decodedText;
          stopScannerIfRunning();
          submitInquiry();
        }, function () {}).catch(function (err) {
          alert('خطا در راه‌اندازی دوربین: ' + err);
          isScanning = false;
          reader.classList.add('hidden');
        });
      });
    }).catch(function (err) {
      alert('اجازه دسترسی به دوربین داده نشد: ' + err);
      reader.classList.add('hidden');
    });
  }

  function stopScannerIfRunning() {
    isScanning = false;
    if (scanTimerId) { clearInterval(scanTimerId); scanTimerId = null; }
    if (objectCountTimer) { clearInterval(objectCountTimer); objectCountTimer = null; }
    objectCountMode = false;
    if (mediaStream) {
      mediaStream.getTracks().forEach(function (t) { t.stop(); });
      mediaStream = null;
    }
    videoTrack = null;
    if (html5QrCode && usingDetectorApi === false) {
      html5QrCode.stop().then(function () { html5QrCode.clear(); }).catch(function () {});
    }
    var reader = document.getElementById('reader');
    reader.classList.add('hidden');
    reader.innerHTML = '';
  }

  /* ---------------- شمارش تعداد کالا با تحلیل تصویر دوربین (بدون تشخیص بارکد) ----------------
   * این حالت فقط بعد از شناسایی کالا (از طریق بارکد) فعال می‌شود. کاربر چند نمونه از همان
   * کالا (مثلاً چند خودکار) را زیر دوربین می‌گیرد و برنامه با تحلیل تصویرِ داخل کادر سبز،
   * تعداد اشیاء مجزا (لکه‌های تیره/روشن جدا از پس‌زمینه) را می‌شمارد و به‌صورت زنده نمایش
   * می‌دهد. کاربر با دکمه «ثبت این تعداد» عدد نهایی را تایید و به یکی از سه شمارش اضافه
   * می‌کند.
   *
   * الگوریتم: تبدیل به سطح خاکستری → آستانه‌گذاری خودکار (Otsu) → پیدا کردن اجزای همبند
   * (flood fill) → فیلتر بر اساس اندازه برای حذف نویز و پس‌زمینه. دقتش به نور یکنواخت و
   * فاصله‌ی مناسب اشیاء از هم بستگی دارد.
   */
  var objectCountMode = false;
  var objectCountTimer = null;
  var liveObjectCount = 0;
  var countCropCanvas = document.createElement('canvas');
  var countCropCtx = countCropCanvas.getContext('2d', { willReadFrequently: true });

  function startObjectCounting() {
    if (!currentProduct) return;
    if (isScanning) stopScannerIfRunning();

    var reader = document.getElementById('reader');
    reader.classList.remove('hidden');
    reader.innerHTML = '<p style="text-align:center; color:#888;">در حال باز کردن دوربین...</p>';

    document.getElementById('countLiveBox').classList.remove('hidden');
    document.getElementById('countLiveProductName').innerText = 'در حال شمارش: ' + (currentProduct.productName || '');
    document.getElementById('countLiveDisplay').innerText = '0';
    document.getElementById('tallyAssignBox').classList.add('hidden');
    liveObjectCount = 0;

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: "continuous" }]
      }
    })
      .then(function (stream) {
        mediaStream = stream;
        videoTrack = stream.getVideoTracks()[0];
        buildScannerUI(reader);
        var video = document.getElementById('scannerVideo');
        video.srcObject = stream;
        return video.play().then(function () { return video; });
      })
      .then(function (video) {
        usingDetectorApi = true;
        isScanning = true;
        objectCountMode = true;
        setupZoomControl();
        setupTorchControl();
        runCountingLoop(video);
      })
      .catch(function (err) {
        reader.classList.add('hidden');
        reader.innerHTML = '';
        document.getElementById('countLiveBox').classList.add('hidden');
        alert('دسترسی به دوربین ممکن نشد: ' + (err && err.message ? err.message : err));
      });
  }

  function runCountingLoop(video) {
    var busy = false;
    objectCountTimer = setInterval(function () {
      if (!isScanning || !objectCountMode || busy || video.readyState < 2) return;
      busy = true;
      try {
        liveObjectCount = countObjectsFromVideo(video);
        document.getElementById('countLiveDisplay').innerText = liveObjectCount;
      } catch (e) { /* یک فریم ناموفق نباید حلقه را متوقف کند */ }
      busy = false;
    }, 400);
  }

  function countObjectsFromVideo(video) {
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return 0;

    var cx = vw * GUIDE_X, cy = vh * GUIDE_TOP;
    var cw = vw * (1 - GUIDE_X * 2);
    var ch = vh * (1 - GUIDE_TOP - GUIDE_BOTTOM);
    if (cw <= 0 || ch <= 0) return 0;

    var targetW = 220; // برای سرعت، تصویر کوچک تحلیل می‌شود
    var scale = targetW / cw;
    countCropCanvas.width = targetW;
    countCropCanvas.height = Math.max(1, Math.round(ch * scale));
    countCropCtx.drawImage(video, cx, cy, cw, ch, 0, 0, countCropCanvas.width, countCropCanvas.height);

    return countObjectsInCanvas(countCropCanvas);
  }

  function countObjectsInCanvas(canvas) {
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var w = canvas.width, h = canvas.height;
    if (w < 2 || h < 2) return 0;
    var imgData = ctx.getImageData(0, 0, w, h);
    var data = imgData.data;
    var n = w * h;

    // تبدیل به سطح خاکستری
    var gray = new Uint8ClampedArray(n);
    for (var i = 0, j = 0; i < data.length; i += 4, j++) {
      gray[j] = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) | 0;
    }

    // آستانه‌گذاری خودکار (روش Otsu)
    var hist = new Array(256).fill(0);
    for (var k = 0; k < n; k++) hist[gray[k]]++;
    var sumAll = 0;
    for (var t = 0; t < 256; t++) sumAll += t * hist[t];
    var sumB = 0, wB = 0, wF = 0, varMax = 0, threshold = 127;
    for (t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      wF = n - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      var mB = sumB / wB, mF = (sumAll - sumB) / wF;
      var varBetween = wB * wF * (mB - mF) * (mB - mF);
      if (varBetween > varMax) { varMax = varBetween; threshold = t; }
    }

    // تشخیص اینکه اشیاء (اقلیت پیکسل‌ها) تیره‌تر هستند یا روشن‌تر از پس‌زمینه
    var below = 0;
    for (k = 0; k < n; k++) if (gray[k] < threshold) below++;
    var objectIsDark = below < n / 2;

    var binary = new Uint8Array(n);
    for (k = 0; k < n; k++) {
      var isObj = objectIsDark ? (gray[k] < threshold) : (gray[k] >= threshold);
      binary[k] = isObj ? 1 : 0;
    }

    // شمارش اجزای همبند (flood fill) با فیلتر اندازه برای حذف نویز
    var visited = new Uint8Array(n);
    var minArea = Math.max(15, Math.floor(n * 0.0015));
    var maxArea = Math.floor(n * 0.35);
    var count = 0;
    var stack = [];

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var idx = y * w + x;
        if (binary[idx] && !visited[idx]) {
          var area = 0;
          stack.push(idx);
          visited[idx] = 1;
          while (stack.length) {
            var cur = stack.pop();
            area++;
            var cx2 = cur % w, cy2 = (cur - cx2) / w;
            if (cx2 > 0) { var l = cur - 1; if (binary[l] && !visited[l]) { visited[l] = 1; stack.push(l); } }
            if (cx2 < w - 1) { var r = cur + 1; if (binary[r] && !visited[r]) { visited[r] = 1; stack.push(r); } }
            if (cy2 > 0) { var u = cur - w; if (binary[u] && !visited[u]) { visited[u] = 1; stack.push(u); } }
            if (cy2 < h - 1) { var d = cur + w; if (binary[d] && !visited[d]) { visited[d] = 1; stack.push(d); } }
          }
          if (area >= minArea && area <= maxArea) count++;
        }
      }
    }
    return count;
  }

  function finishObjectCounting() {
    var finalCount = liveObjectCount;
    stopScannerIfRunning();
    document.getElementById('countLiveBox').classList.add('hidden');

    if (!finalCount || finalCount < 1) {
      alert('عددی شمارش نشد. لطفا دوباره امتحان کنید.');
      return;
    }
    var box = document.getElementById('tallyAssignBox');
    box.querySelector('.tallyCountText').innerText = 'تعداد شمارش‌شده با دوربین: ' + finalCount;
    box.dataset.count = finalCount;
    box.classList.remove('hidden');
  }

  function cancelObjectCounting() {
    stopScannerIfRunning();
    document.getElementById('countLiveBox').classList.add('hidden');
    liveObjectCount = 0;
  }

  function assignTally(n) {
    var box = document.getElementById('tallyAssignBox');
    var count = Number(box.dataset.count || 0);
    if (!count) return;
    var newInput = document.getElementById('new' + n);
    var current = newInput.value.trim() === '' ? 0 : Number(newInput.value.trim());
    newInput.value = current + count;
    newInput.dispatchEvent(new Event('input'));
    box.classList.add('hidden');
  }

  function cancelTallyAssign() {
    document.getElementById('tallyAssignBox').classList.add('hidden');
  }
</script>
</body>
</html>
